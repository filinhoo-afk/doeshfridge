<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128">
  <!-- Силуэт для тематических иконок Android 13+. Лаунчер берёт только
       альфа-канал и красит его сам. Знак «Доешь» и так одноцветный, поэтому
       силуэт совпадает с glyph.svg. Если в знаке появятся детали, различимые
       только цветом, здесь их нужно перерисовать контуром. -->
  <g fill="none" stroke="#fff" stroke-linecap="round" stroke-linejoin="round">
    <path d="M44 83 V31 H84 V83" stroke-width="10"/>
    <path d="M34 97 V85 H94 V97" stroke-width="10"/>
    <path d="M44 51 H84" stroke-width="6"/>
    <path d="M74 59 V73" stroke-width="6"/>
  </g>
</svg>
