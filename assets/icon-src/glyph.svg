<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128">
  <!-- Знак «Доешь»: буква «Д», нарисованная как холодильник.
       Корпус — «П» без нижней перекладины, основание с ножками — нижняя часть «Д».
       Внутри граница морозилки и ручка двери. Знак белый: фон подкладывает
       scripts/build-icons.mjs, чтобы один исходник годился для всех иконок. -->
  <g fill="none" stroke="#fff" stroke-linecap="round" stroke-linejoin="round">
